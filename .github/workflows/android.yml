name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution and dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      # The Firebase config is not in git. A repository secret holds the real
      # one; without it the build uses a placeholder, which compiles but cannot
      # receive pushes. local.properties is not needed: the Supabase and Maps
      # keys fall back to empty strings, which is enough to build and test.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp .github/ci/google-services.json app/google-services.json
          fi

      # Unit tests include the Compose UI and Room tests, which run on the JVM
      # through Robolectric, so no emulator is needed.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest :domain:test :app:lintDebug --stacktrace

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sfa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfa-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.html
          retention-days: 14
